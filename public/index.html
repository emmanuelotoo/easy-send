<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Easy-Send</title>
  <meta name="description" content="Send mobile money in two taps.">
  <meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F0D" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Easy-Send">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app" aria-live="off">
    <div class="boot" aria-label="Loading Easy-Send"><span class="spinner"></span></div>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Easy-Send needs JavaScript turned on.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
